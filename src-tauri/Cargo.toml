[package]
name = "gigahost-desktop"
version = "0.1.4"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
default-run = "gigahost-desktop"

[workspace]

[lib]
name = "gigahost_desktop"

[[bin]]
name = "gigahost-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "desktop-driver"
path = "src/driver.rs"
required-features = ["test-driver"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-window-state", "dep:glib"]
test-driver = []

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "time", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
zeroize = "1"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
glib = { version = "0.18", optional = true }
