name: Desktop packages

# No automatic master/PR builds. Dispatch produces a reviewable artifact;
# a version-matched desktop tag also publishes checked packages to the CDN.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish checked Windows, Linux, and macOS packages to the configured CDN
        type: boolean
        default: false
      macos_only:
        description: Check only macOS; do not publish
        type: boolean
        default: false
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  build:
    if: ${{ !github.event.repository.private && !inputs.macos_only }}
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: .
    env:
      DESKTOP_BUILD_DIR: ${{ github.workspace }}/desktop-build
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop-build/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain unavailable.' }

      - uses: Swatinem/rust-cache@v2
        with:
          # Retain successful compilation if a later installer/runtime check
          # fails, so fixing that check does not require another cold build.
          cache-on-failure: true
          workspaces: src-tauri -> ../desktop-build/desktop
          shared-key: desktop-rust-1.97-${{ hashFiles('src-tauri/Cargo.lock', 'build-dependencies.json') }}

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.DESKTOP_BUILD_DIR }}/components
            ${{ env.DESKTOP_BUILD_DIR }}/targets
          key: desktop-components-${{ runner.os }}-rust-1.97-${{ hashFiles('build-dependencies.json') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build ZIP containing the installer
        run: ./scripts/build-windows.ps1

      - name: Frontend checks
        working-directory: .
        run: |
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }

      - name: Native controller checks
        env:
          GIGAHOST_TEST_GHOST: ${{ github.workspace }}/src-tauri/binaries/gigahost-ghost-x86_64-pc-windows-msvc.exe
          GIGAHOST_TEST_WALLET: ${{ github.workspace }}/src-tauri/binaries/gigahost-mmxwallet-x86_64-pc-windows-msvc.exe
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Desktop formatting failed.' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features test-driver
          if ($LASTEXITCODE -ne 0) { throw 'Native controller tests failed.' }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features test-driver --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native controller clippy failed.' }

      - name: Install, launch, and uninstall the packaged app
        run: ./scripts/smoke-windows.ps1

      - name: Upload ZIP and provenance
        uses: actions/upload-artifact@v4
        with:
          name: gigahost-windows-x64
          path: |
            artifacts/packages/gigahost_*_windows_x64.zip
            artifacts/packages/sha256sums-windows-x64
            artifacts/packages/build.json
          if-no-files-found: error
          retention-days: 30

  linux:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore Linux build dependencies
        id: linux-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/cargo
            artifacts/build
          key: desktop-linux-rust-1.97-${{ hashFiles('build-dependencies.json') }}-${{ hashFiles('build-dependencies.json', 'src-tauri/Cargo.lock', 'Dockerfile') }}

      - name: Build Ubuntu 22.04 packages
        run: scripts/build-linux-container.sh

      - name: Frontend, controller and publisher checks
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/src" --env HOME=/tmp --env RUSTUP_TOOLCHAIN=1.97.0 --env CARGO_HOME=/src/artifacts/cargo --env CARGO_TARGET_DIR=/src/artifacts/build/desktop gigahost-desktop-linux:0.1.0 bash -c 'npm ci && npm test && cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features test-driver'
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Launch the packaged Linux app
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/src" --volume /etc/passwd:/etc/passwd:ro --volume /etc/group:/etc/group:ro --env HOME=/tmp --env APPIMAGE_EXTRACT_AND_RUN=1 gigahost-desktop-linux:0.1.0 bash -c 'package=$(find artifacts/packages -maxdepth 1 -name "gigahost_*_amd64.appimage" -print -quit); dbus-run-session -- xvfb-run -a python3 tests/window-state.py "$package"'

      - uses: actions/upload-artifact@v4
        with:
          name: gigahost-linux-x64
          path: |
            artifacts/packages/gigahost_*_amd64.deb
            artifacts/packages/gigahost_*_amd64.appimage
            artifacts/packages/sha256sums
            artifacts/packages/build.json
          if-no-files-found: error
          retention-days: 30

      - name: Save Linux build dependencies
        # Retain successful compilation even if a later runtime check fails.
        if: always() && steps.linux-cache.outputs.cache-hit != 'true' && steps.linux-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/cargo
            artifacts/build
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}

  macos:
    if: ${{ !github.event.repository.private }}
    # Explicit Apple Silicon runner; macos-latest changes across OS versions.
    runs-on: macos-14
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      DESKTOP_BUILD_DIR: ${{ github.workspace }}/desktop-build-macos
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop-build-macos/desktop
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97 and both macOS targets
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri -> ../desktop-build-macos/desktop
          shared-key: desktop-rust-1.97-${{ hashFiles('src-tauri/Cargo.lock', 'build-dependencies.json') }}

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.DESKTOP_BUILD_DIR }}/components
            ${{ env.DESKTOP_BUILD_DIR }}/targets
          key: desktop-components-${{ runner.os }}-rust-1.97-${{ hashFiles('build-dependencies.json') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build universal ad-hoc signed preview DMG
        run: scripts/build-macos.sh

      - name: Frontend and package verification checks
        run: |
          set -euo pipefail
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Native Apple Silicon controller checks
        env:
          GIGAHOST_TEST_GHOST: ${{ github.workspace }}/src-tauri/binaries/gigahost-ghost-universal-apple-darwin
          GIGAHOST_TEST_WALLET: ${{ github.workspace }}/src-tauri/binaries/gigahost-mmxwallet-universal-apple-darwin
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features test-driver
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features test-driver --all-targets -- -D warnings

      - name: Install and launch the DMG natively on Apple Silicon
        run: python3 scripts/smoke-macos.py --native-arch arm64

      - name: Upload universal DMG and provenance
        uses: actions/upload-artifact@v4
        with:
          name: gigahost-macos-universal
          path: |
            artifacts/packages/gigahost_*_macos_universal.dmg
            artifacts/packages/sha256sums-macos-universal
            artifacts/packages/build.json
          if-no-files-found: error
          retention-days: 30

  macos-intel:
    if: ${{ !github.event.repository.private }}
    needs: macos
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: gigahost-macos-universal
          path: packages/macos

      - name: Install and launch the same DMG natively on Intel
        run: python3 scripts/smoke-macos.py --packages packages/macos --native-arch x86_64

  publish:
    if: ${{ !github.event.repository.private && !inputs.macos_only && (startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish) }}
    needs: [build, linux, macos-intel]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: desktop-cdn-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: gigahost-windows-x64
          path: packages/windows

      - uses: actions/download-artifact@v4
        with:
          name: gigahost-linux-x64
          path: packages/linux

      - uses: actions/download-artifact@v4
        with:
          name: gigahost-macos-universal
          path: packages/macos

      - name: Install the publisher dependencies
        run: python3 -m pip install -r scripts/requirements-publish.txt

      - name: Verify and publish all desktop packages
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_S3_SECRET_ACCESS_KEY }}
          DESKTOP_STORAGE_PASSWORD: ${{ secrets.DESKTOP_STORAGE_PASSWORD }}
          DESKTOP_UPLOAD_TRANSPORT: ${{ vars.DESKTOP_UPLOAD_TRANSPORT || 's3' }}
          DESKTOP_STORAGE_ENDPOINT: ${{ vars.DESKTOP_STORAGE_ENDPOINT }}
          DESKTOP_S3_ENDPOINT: ${{ vars.DESKTOP_S3_ENDPOINT }}
          DESKTOP_S3_BUCKET: ${{ vars.DESKTOP_S3_BUCKET || 'gigahost-apps' }}
          DESKTOP_S3_REGION: ${{ vars.DESKTOP_S3_REGION || 'sg' }}
          DESKTOP_S3_PREFIX: ${{ vars.DESKTOP_S3_PREFIX || 'desktop' }}
          DESKTOP_PUBLIC_BASE: ${{ vars.DESKTOP_PUBLIC_BASE || 'https://apps.gigahost.cloud' }}
          BUILD_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          python3 scripts/publish-desktop.py --windows-dir packages/windows \
            --linux-dir packages/linux --macos-dir packages/macos --version "$version" --revision "$BUILD_REVISION"
